<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KeyCartX</title>
    <meta name="description" content="Premium drops, delivered to your door. Shop car accessories, apparel and more at KeyCartX." />

    <!-- Default link-preview card. Product pages are given their own title,
         photo and price by api/og.ts, which vercel.json routes preview
         crawlers to - they cannot run the JavaScript that builds this page. -->
    <meta property="og:site_name" content="KeyCartX" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KeyCartX" />
    <meta property="og:description" content="Premium drops, delivered to your door." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="KeyCartX" />
    <meta name="twitter:description" content="Premium drops, delivered to your door." />
  </head>
  <body class="bg-secondary text-primary antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
